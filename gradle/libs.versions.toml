[versions]
jdk = "25"
minecraft = "26.3"

kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
dokka = "2.3.0"
junit = "6.1.3"

fabric-loom = "1.19-SNAPSHOT"
fabric-loader = "0.19.5"
fabric-api = "0.165.0+26.3"
fabric-kotlin = "1.14.1+kotlin.2.4.20"
gametest-harness = "2.0.0+26.3"
litematica = "0.29.1"
malilib = "0.30.2"

paper = "26.3.build.249-stable"
paperweight = "2.0.0-beta.24"
run-paper = "3.1.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
gametest-harness = { group = "net.ccbluex", name = "gametest-harness", version.ref = "gametest-harness" }
fastutil = { group = "it.unimi.dsi", name = "fastutil", version = "8.5.18" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.17" }
litematica = { group = "maven.modrinth", name = "litematica", version.ref = "litematica" }
malilib = { group = "maven.modrinth", name = "malilib", version.ref = "malilib" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka-base = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
