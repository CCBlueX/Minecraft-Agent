name: Pages

# The site generator lives on the orphan branch `pages`; this only runs it against main.
on:
  push:
    branches: [main]
    paths: [README.md, SKILL.md, '.agent-usage/**', '**/src/main/**']
  workflow_dispatch:
  # Picks up new usage in the related private repositories
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    # GitHub Free serves Pages only from public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: pages
          path: site-generator
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build the API docs
        run: |
          ./gradlew -Dorg.gradle.jvmargs=-Xmx2g dokkaGeneratePublicationHtml
          mkdir -p "$RUNNER_TEMP/api"
          for html in */build/dokka/html */*/build/dokka/html; do
            [ -d "$html" ] || continue
            module=${html%/build/dokka/html}
            cp -r "$html" "$RUNNER_TEMP/api/${module//\//-}"
          done
      - name: Total the AI usage
        # Counts the private related repositories named in the secret, see agent-usage's README
        env:
          GH_TOKEN: ${{ secrets.AGENT_USAGE_TOKEN }}
          AGENT_USAGE_RELATED: ${{ secrets.AGENT_USAGE_RELATED }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/agent-usage" https://raw.githubusercontent.com/1zun4/agent-usage/v1.1.0/agent-usage
          echo "c5c7a8335d239abcfea7ba5b61ff889b0903bb6f3543a903274aa8c33441f57d  $RUNNER_TEMP/agent-usage" | sha256sum -c -
          python3 "$RUNNER_TEMP/agent-usage" summary --json > "$RUNNER_TEMP/ai-usage.json"
      - name: Generate the site
        # static/ on the pages branch holds the README clips, served as they are
        working-directory: site-generator
        run: >-
          ./gradlew -Dorg.gradle.jvmargs=-Xmx1g run --args="--main $GITHUB_WORKSPACE --api $RUNNER_TEMP/api
          --out $RUNNER_TEMP/site --static $GITHUB_WORKSPACE/site-generator/static --usage $RUNNER_TEMP/ai-usage.json"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
